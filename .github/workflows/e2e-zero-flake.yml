name: e2e-zero-flake

on:
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project to repeat
        required: true
        type: choice
        options:
          - chromium
          - pixel-7
          - iphone-14
      repeat_each:
        description: Repeat count
        required: true
        default: '25'
        type: choice
        options:
          - '25'
          - '50'
      test_args:
        description: Optional extra Playwright args, for example a spec path
        required: false
        default: ''
        type: string

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x edge-runtime
      - run: supabase db reset --local
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Bake test env into production build
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
            echo "RESEND_API_KEY=test-resend-api-key"
            echo "NEXT_PUBLIC_DISABLE_UIR=1"
            echo "NEXT_PUBLIC_E2E=1"
          } > .env.production
          cp .env.production .env.test
      - name: Build production
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
          NEXT_PUBLIC_DISABLE_UIR: '1'
          NEXT_PUBLIC_E2E: '1'
      - name: Free disk before e2e
        run: rm -rf .next/cache
      - name: Repeat target without retries
        run: >
          pnpm exec playwright test ${{ inputs.test_args }}
          --project=${{ inputs.project }}
          --repeat-each=${{ inputs.repeat_each }}
          --retries=0
          --fail-on-flaky-tests
          --workers=1
        env:
          E2E_PROD_BUILD: '1'
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-zero-flake-${{ inputs.project }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
