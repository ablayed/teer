name: e2e-prod

# E2E sur un VRAI build de production (`next build` + `next start`), pour attraper la
# classe de bugs PROD-ONLY que `next dev` ne reproduit pas — au premier chef le Router
# Cache client de Next.js (issue #3 : commande créée invisible). Le job `test-e2e` de
# ci.yml tourne en `pnpm dev` et serait vert À TORT sur ces régressions.
#
# Pour ne pas alourdir chaque push, ce workflow ne se déclenche QUE :
#   • à la demande (workflow_dispatch) ;
#   • sur les PR touchant les surfaces navigation/cache (app, components, middleware,
#     config, harnais e2e).
# Il n'exécute que le sous-ensemble de specs gardées par E2E_PROD_BUILD=1.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'playwright.config.ts'
      - 'tests/e2e/**'
      - '.github/workflows/e2e-prod.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset --local
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Bake test env into production build
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
            echo "RESEND_API_KEY=test-resend-api-key"
            echo "NEXT_PUBLIC_DISABLE_UIR=1"
          } > .env.production
          cp .env.production .env.test
      # Build de PROD : les NEXT_PUBLIC_* (Supabase local) sont inlinés ici. C'est ce
      # build que `next start` (webServer Playwright en mode E2E_PROD_BUILD=1) servira.
      # NEXT_PUBLIC_DISABLE_UIR=1 est inliné ICI dans le bundle middleware/edge → la CSP
      # du build de test n'émet pas `upgrade-insecure-requests` (sinon WebKit blanchit sur
      # http://localhost). En prod réelle ce flag est absent → UIR émis à l'identique.
      - name: Build production
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
          NEXT_PUBLIC_DISABLE_UIR: '1'
      # Specs PROD-ONLY : issue #3 (commande créée visible) + pagination keyset +
      # LOT PERF #4 (nav-perf : feedback tap / pending / squelette loading.tsx — le
      # prefetch et le Router Cache `staleTimes` ne s'exercent qu'en build de prod).
      # Cibles chromium + pixel-7 (moteur Chromium) UNIQUEMENT : les comportements visés
      # sont indépendants du moteur, et le build de prod émet `upgrade-insecure-requests`
      # que WebKit applique jusqu'à http://localhost (→ page blanche, faux échec). La
      # couverture WebKit cross-navigateur reste assurée par le job test-e2e (dev, http
      # sans UIR), qui exécute aussi nav-perf sur iphone-14. Cf. tests/e2e en-têtes.
      - name: E2E prod-build (sous-ensemble gardé)
        run: pnpm exec playwright test tests/e2e/orders-prod-cache.spec.ts tests/e2e/orders-pagination-verify.spec.ts tests/e2e/drivers.spec.ts:440 tests/e2e/nav-perf.spec.ts --project=chromium --project=pixel-7
        env:
          E2E_PROD_BUILD: '1'
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-prod
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
