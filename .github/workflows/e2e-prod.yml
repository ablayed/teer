name: e2e-prod

# E2E sur un VRAI build de production (`next build` + `next start`), pour attraper la
# classe de bugs PROD-ONLY que `next dev` ne reproduit pas — au premier chef le Router
# Cache client de Next.js (issue #3 : commande créée invisible). Le job `test-e2e` de
# ci.yml tourne en `pnpm dev` et serait vert À TORT sur ces régressions.
#
# Pour ne pas alourdir chaque push, ce workflow ne se déclenche QUE :
#   • à la demande (workflow_dispatch) ;
#   • sur les PR touchant les surfaces navigation/cache (app, components, middleware,
#     config, harnais e2e).
# Il n'exécute que le sous-ensemble de specs gardées par E2E_PROD_BUILD=1.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'playwright.config.ts'
      - 'tests/e2e/**'
      - '.github/workflows/e2e-prod.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset --local
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Build de PROD : les NEXT_PUBLIC_* (Supabase local) sont inlinés ici. C'est ce
      # build que `next start` (webServer Playwright en mode E2E_PROD_BUILD=1) servira.
      - name: Build production
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      # Sous-ensemble PROD-ONLY uniquement (specs gardées par E2E_PROD_BUILD=1) :
      # issue #3 (commande créée visible) + vérification de la pagination keyset.
      - name: E2E prod-build (sous-ensemble gardé)
        run: pnpm exec playwright test tests/e2e/orders-prod-cache.spec.ts tests/e2e/orders-pagination-verify.spec.ts
        env:
          E2E_PROD_BUILD: '1'
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-prod
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
