name: ci
# lot2a rebase on main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Détection de chemins pour le job l1-backfill-harness (coûteux : ~2,5 min,
  # 2 `supabase db reset --local`). Le filtre couvre la migration elle-même,
  # le script et ses fixtures, ET ce fichier de workflow — un harnais qui ne
  # se rejoue pas quand on modifie sa propre fixture peut être désarmé sans
  # que personne s'en aperçoive.
  changes:
    runs-on: ubuntu-latest
    outputs:
      l1: ${{ steps.filter.outputs.l1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            l1:
              - 'supabase/migrations/**'
              - 'scripts/l1-*'
              - 'scripts/l1-harness-fixtures/**'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Scan de secrets, en parallèle de lint (aucun `needs`). Échoue le workflow sur
  # toute fuite. fetch-depth: 0 → scanne tout l'historique, pas seulement le dernier
  # commit. Faux positifs (lockfile, .env.example) allowlistés dans .gitleaks.toml.
  gitleaks:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  test-rls:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        # Version épinglée (et non `latest`) : une CLI récente n'émet plus les clés
        # locales anon/service au format JWT attendu par le harness RLS
        # (-> "invalid JWT ... could not base64 decode"). On aligne sur la devDep
        # `supabase` (2.102.0), version de référence du projet.
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (sanitized diagnostics)
        run: |
          supabase_log="$(mktemp)"
          if supabase start -x edge-runtime >"$supabase_log" 2>&1; then
            rm -f "$supabase_log"
          else
            status=$?
            echo "::error::supabase start failed (exit $status)"
            grep -Eiu 'error|failed|failure|timeout|timed out|unable|cannot|denied|refused|network|connection|pull|download' "$supabase_log" \
              | sed -E '/key|token|secret|password|credential|jwt/Ic\[redacted sensitive diagnostic line]' \
              || true
            rm -f "$supabase_log"
            exit "$status"
          fi
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - run: pnpm test:rls
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          # Lot R2 (Phase F) : tests/rls/shopify-refund-shop-scoped-order-resolution importe
          # lib/shopify/webhook-core.ts (dispatchWebhookCore), qui importe transitivement
          # lib/env.ts (via lib/shopify/apps.ts) — validation Zod au chargement du module.
          # RESEND_API_KEY (schéma serveur) et NEXT_PUBLIC_SUPABASE_URL/ANON_KEY (schéma
          # public, jamais posés par ce job jusqu'ici) sont requis même si jamais lus par ce
          # test. Mêmes valeurs/secret synthétique que les autres étapes de ce fichier.
          RESEND_API_KEY: test-resend-api-key
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
      # Lot 4A — Couche 2 : la baseline ACL committée doit refléter l'état réel du
      # stack local fraîchement rejoué par ce même job. Échoue explicitement (jamais un
      # saut silencieux) si le fichier est absent ou périmé — voir
      # scripts/generate-acl-baseline.mjs et CLAUDE.md, section "Lot 4A".
      - run: pnpm security:acl-baseline:check
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Lot S4 — Splinter (0011/0028/0029) par requête directe sur les schémas exposés,
      # cf. scripts/s4-run-splinter.mjs et docs/security/s4-rapport.md.
      - run: pnpm security:splinter:check
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Lot S4 — inventaire justifié des références à SUPABASE_SERVICE_ROLE_KEY,
      # cf. scripts/s4-check-service-role-inventory.mjs.
      - run: pnpm security:service-role-inventory:check
      - run: pnpm security:test-postgres-boundary:check
      - run: pnpm security:maintenance-import-boundary:check

  # Lot L1 — le backfill de 0142 s'exécute UNE SEULE FOIS en production ; un
  # `db reset --local` ordinaire ne l'exerce jamais (supabase/seed.sql ne
  # contient aucune boutique Shopify, tous les comptes vaudraient 0=0). Ce job
  # monte des bases fraîches et isolées (jamais le seed global), injecte une
  # fixture Shopify réaliste et vérifie les comptes exacts entité par entité,
  # plus le cas négatif "webhook dont la boutique n'est pas résoluble". Voir
  # scripts/l1-backfill-harness.sh et CLAUDE.md pour le détail. Coûteux
  # (~2,5 min, 2 `db reset --local`) : gated par path-filter (job `changes`),
  # pas exécuté à chaque push.
  l1-backfill-harness:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.l1 == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (sanitized diagnostics)
        run: |
          supabase_log="$(mktemp)"
          if supabase start -x edge-runtime >"$supabase_log" 2>&1; then
            rm -f "$supabase_log"
          else
            status=$?
            echo "::error::supabase start failed (exit $status)"
            grep -Eiu 'error|failed|failure|timeout|timed out|unable|cannot|denied|refused|network|connection|pull|download' "$supabase_log" \
              | sed -E '/key|token|secret|password|credential|jwt/Ic\[redacted sensitive diagnostic line]' \
              || true
            rm -f "$supabase_log"
            exit "$status"
          fi
      - run: bash scripts/l1-backfill-harness.sh

  test-e2e-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [typecheck, test-unit]
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, pixel-7, iphone-14]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (sanitized diagnostics)
        run: |
          supabase_log="$(mktemp)"
          if supabase start -x edge-runtime >"$supabase_log" 2>&1; then
            rm -f "$supabase_log"
          else
            status=$?
            echo "::error::supabase start failed (exit $status)"
            grep -Eiu 'error|failed|failure|timeout|timed out|unable|cannot|denied|refused|network|connection|pull|download' "$supabase_log" \
              | sed -E '/key|token|secret|password|credential|jwt/Ic\[redacted sensitive diagnostic line]' \
              || true
            rm -f "$supabase_log"
            exit "$status"
          fi
      - run: supabase db reset --local
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      # La cible iphone-14 du playwright.config tourne sous webkit ; chromium seul faisait
      # échouer tous les scénarios iphone-14 (Executable doesn't exist). On installe les deux.
      - name: Install Playwright browsers and deps
        timeout-minutes: 26
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::playwright install (tentative $attempt/3)"
            # `sudo apt-get` peut survivre au PID de tête après un stall miroir.
            # Une session dédiée donne au watchdog un PGID unique à tuer en entier.
            setsid pnpm exec playwright install --with-deps chromium webkit &
            pgid=$!
            (
              sleep 8m
              if sudo kill -0 -- "-$pgid" 2>/dev/null; then
                echo "::warning::Tentative $attempt dépasse 8 min ; arrêt TERM du groupe $pgid."
                if ! sudo kill -TERM -- "-$pgid"; then
                  echo "::error::Impossible d'envoyer TERM au groupe $pgid."
                fi
                sleep 5
                if sudo kill -0 -- "-$pgid" 2>/dev/null; then
                  echo "::warning::Le groupe $pgid survit à TERM ; arrêt KILL."
                  if ! sudo kill -KILL -- "-$pgid"; then
                    echo "::error::Impossible d'envoyer KILL au groupe $pgid."
                  fi
                fi
              fi
            ) &
            watchdog=$!
            if wait "$pgid"; then
              kill "$watchdog" 2>/dev/null || true
              wait "$watchdog" 2>/dev/null || true
              echo "::endgroup::"
              exit 0
            fi
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            echo "::endgroup::"
            echo "::warning::Tentative $attempt echouee ou expiree apres 8 min (stall miroir apt probable)."
            sleep 15
          done
          echo "::error::playwright install a echoue 3 fois de suite - stall persistant, pas un alea."
          exit 1
      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.mjs', 'middleware.ts', 'app/**', 'components/**', 'i18n/**', 'lib/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-next-
      # Toute la suite tourne désormais sur un VRAI build de prod (`next build` +
      # `next start` via E2E_PROD_BUILD=1), sur les 3 cibles. But : supprimer la
      # compilation on-demand `next dev` qui rendait des routes lourdes flaky sous
      # charge (analytics:456, orders-transitions:539…). Pattern repris de e2e-prod.yml.
      - name: Bake test env into production build
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_DISABLE_UIR=1"
          } > .env.production
      # NEXT_PUBLIC_DISABLE_UIR=1 inliné ICI dans le bundle middleware/edge → la CSP du
      # build de test n'émet pas `upgrade-insecure-requests` (sinon WebKit/iphone-14
      # blanchit sur http://localhost). En prod réelle ce flag est absent → UIR émis.
      - name: Build production
        run: pnpm build
        env:
          # VERCEL_ENV=preview : ce build tourne avec des secrets synthétiques (RESEND_API_KEY
          # factice, pas de CRON_SECRET/UPSTASH réels) — sans ce flag, isProductionEnvironment()
          # (lib/security/environment-validation.ts, 142dfa8) le traite comme un build de
          # production réel et échoue sur "Unsafe production environment configuration".
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
          NEXT_PUBLIC_DISABLE_UIR: '1'
      # Hygiène disque avant `next start` : le cache de build webpack/SWC (`.next/cache`)
      # n'est PAS utilisé au runtime par `next start` (qui sert depuis `.next/server` et
      # `.next/static`). On le purge pour rendre de la place sur un runner partagé avec les
      # images docker de `supabase start` + le `.next` de prod. NE JAMAIS `rm -rf .next` :
      # `next start` en a besoin. Les `df -h` encadrants mesurent la marge réelle (1er run).
      - name: Free disk before e2e (drop next build cache)
        run: |
          df -h /
          rm -rf .next/cache
          df -h /
      - name: List targeted Phase 1 E2E selection
        run: pnpm exec playwright test tests/e2e/shop-filter.spec.ts tests/e2e/shopify-webhooks.spec.ts tests/e2e/shopify-koba-multi-app.spec.ts tests/e2e/workspace-routing.spec.ts --project=${{ matrix.project }} --list
      # Fast Phase 1 acceptance: explicitly pass the spec paths to Playwright.
      # Calling `pnpm test:e2e` here would expand the package script's
      # `tests/e2e` path before forwarding arguments on Windows and collect the
      # entire catalogue instead of this targeted set.
      - run: pnpm exec playwright test tests/e2e/shop-filter.spec.ts tests/e2e/shopify-webhooks.spec.ts tests/e2e/shopify-koba-multi-app.spec.ts tests/e2e/workspace-routing.spec.ts --project=${{ matrix.project }}
        env:
          E2E_PROD_BUILD: '1'
          # webServer (playwright.config.ts) hérite de cet env pour spawn `next start` ;
          # sans VERCEL_ENV=preview le runtime retombe aussi sous le garde-fou 142dfa8.
          VERCEL_ENV: preview
          # Valeurs synthétiques ci-dessous : le serveur Next et les specs Playwright signent/
          # vérifient la même chaîne factice, jamais un secret Partner ou de production. Tout
          # secret réel de ce workflow passe par `secrets.*` — ces `test-only-fake-*` sont en
          # clair délibérément : un secret GitHub ne se relit pas, et un credential factice qui
          # se lit comme tel ne peut pas être confondu pour du réel ni remplacé sans y penser.
          SHOPIFY_API_KEY: test-only-fake-dev-client-id
          SHOPIFY_API_SECRET: test-only-fake-dev-secret
          # Lot L0 — harnais multi-app KOBA/PILOTE (tests/e2e/shopify-koba-multi-app.spec.ts).
          # Mêmes chaînes littérales que les valeurs de repli de
          # tests/e2e/helpers/shopify-webhook-harness.ts.
          SHOPIFY_KOBA_API_KEY: test-only-fake-koba-client-id
          SHOPIFY_KOBA_API_SECRET: test-only-fake-koba-secret
          SHOPIFY_PILOTE_API_KEY: test-only-fake-pilote-client-id
          SHOPIFY_PILOTE_API_SECRET: test-only-fake-pilote-secret
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      - name: Remove test environment files
        if: always()
        run: rm -f .env.production .env.test
      # Diagnostic : sur échec, on remonte les traces Playwright (call log + snapshots DOM/ARIA
      # par action) pour voir EXACTEMENT quelle action pend, plutôt que de supposer.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-phase1-${{ matrix.project }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      # Jeton de succes consomme par l'agregat `test-e2e (<project>)`.
      # Publie UNIQUEMENT si ce job a reussi : son absence fait echouer l'agregat.
      - name: Publish success marker
        run: mkdir -p e2e-markers && echo ok > e2e-markers/phase1-${{ matrix.project }}.ok
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-ok-${{ matrix.project }}-phase1
          path: e2e-markers/
          retention-days: 7
          if-no-files-found: error

  test-e2e-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [typecheck, test-unit]
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, pixel-7, iphone-14]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (sanitized diagnostics)
        run: |
          supabase_log="$(mktemp)"
          if supabase start -x edge-runtime >"$supabase_log" 2>&1; then
            rm -f "$supabase_log"
          else
            status=$?
            echo "::error::supabase start failed (exit $status)"
            grep -Eiu 'error|failed|failure|timeout|timed out|unable|cannot|denied|refused|network|connection|pull|download' "$supabase_log" \
              | sed -E '/key|token|secret|password|credential|jwt/Ic\[redacted sensitive diagnostic line\]' \
              || true
            rm -f "$supabase_log"
            exit "$status"
          fi
      - run: supabase db reset --local
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Read Playwright version
        id: playwright-version-regression
        run: echo "version=$(node -p 'require(\"@playwright/test/package.json\").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version-regression.outputs.version }}
      - name: Install Playwright browsers and deps
        timeout-minutes: 26
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::playwright install (tentative $attempt/3)"
            # `sudo apt-get` peut survivre au PID de tête après un stall miroir.
            # Une session dédiée donne au watchdog un PGID unique à tuer en entier.
            setsid pnpm exec playwright install --with-deps chromium webkit &
            pgid=$!
            (
              sleep 8m
              if sudo kill -0 -- "-$pgid" 2>/dev/null; then
                echo "::warning::Tentative $attempt dépasse 8 min ; arrêt TERM du groupe $pgid."
                if ! sudo kill -TERM -- "-$pgid"; then
                  echo "::error::Impossible d'envoyer TERM au groupe $pgid."
                fi
                sleep 5
                if sudo kill -0 -- "-$pgid" 2>/dev/null; then
                  echo "::warning::Le groupe $pgid survit à TERM ; arrêt KILL."
                  if ! sudo kill -KILL -- "-$pgid"; then
                    echo "::error::Impossible d'envoyer KILL au groupe $pgid."
                  fi
                fi
              fi
            ) &
            watchdog=$!
            if wait "$pgid"; then
              kill "$watchdog" 2>/dev/null || true
              wait "$watchdog" 2>/dev/null || true
              echo "::endgroup::"
              exit 0
            fi
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            echo "::endgroup::"
            echo "::warning::Tentative $attempt echouee ou expiree apres 8 min (stall miroir apt probable)."
            sleep 15
          done
          echo "::error::playwright install a echoue 3 fois de suite - stall persistant, pas un alea."
          exit 1
      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.mjs', 'middleware.ts', 'app/**', 'components/**', 'i18n/**', 'lib/**', 'messages/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - name: Bake test env into production build
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_DISABLE_UIR=1"
          } > .env.production
      - name: Build production
        run: pnpm build
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
          NEXT_PUBLIC_DISABLE_UIR: '1'
      - name: Free disk before e2e (drop next build cache)
        run: |
          df -h /
          rm -rf .next/cache
          df -h /
      - name: Run complete E2E regression shard
        run: pnpm exec playwright test tests/e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4
        env:
          E2E_PROD_BUILD: '1'
          VERCEL_ENV: preview
          # Valeur synthétique, jamais un secret Partner — voir le commentaire équivalent dans
          # le job test-e2e-phase1 ci-dessus.
          SHOPIFY_API_KEY: test-only-fake-dev-client-id
          SHOPIFY_API_SECRET: test-only-fake-dev-secret
          # Ce job balaie tout tests/e2e (contrairement à test-e2e-phase1, qui liste ses specs
          # nommément) et ramasse donc aussi tests/e2e/shopify-koba-multi-app.spec.ts et
          # tests/e2e/shopify-ingestion-dual-write.spec.ts. Sans ces quatre lignes, ces specs
          # tournent quand même : playwright.config.ts pose un repli inconditionnel pour ces
          # quatre variables dès qu'elles sont absentes de l'environnement (vérifié : run local
          # avec exactement SHOPIFY_API_KEY/SECRET seuls → 6/6 tests KOBA exécutés, zéro skip).
          # Elles sont posées ICI explicitement pour ne plus dépendre de ce repli dans un job qui
          # gate le merge — si le repli de playwright.config.ts est un jour resserré, ce job ne
          # doit pas se mettre à skipper silencieusement sans signal CI.
          SHOPIFY_KOBA_API_KEY: test-only-fake-koba-client-id
          SHOPIFY_KOBA_API_SECRET: test-only-fake-koba-secret
          SHOPIFY_PILOTE_API_KEY: test-only-fake-pilote-client-id
          SHOPIFY_PILOTE_API_SECRET: test-only-fake-pilote-secret
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      - name: Remove test environment files
        if: always()
        run: rm -f .env.production .env.test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-regression-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-regression-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish success marker
        run: |
          mkdir -p e2e-markers
          echo ok > e2e-markers/regression-${{ matrix.project }}-${{ matrix.shard }}.ok
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-ok-${{ matrix.project }}-regression-${{ matrix.shard }}
          path: e2e-markers/
          retention-days: 7
          if-no-files-found: error

  test-visual-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [typecheck, test-unit]
    env:
      TZ: Africa/Dakar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (sanitized diagnostics)
        run: |
          supabase_log="$(mktemp)"
          if supabase start -x edge-runtime >"$supabase_log" 2>&1; then
            rm -f "$supabase_log"
          else
            status=$?
            echo "::error::supabase start failed (exit $status)"
            grep -Eiu 'error|failed|failure|timeout|timed out|unable|cannot|denied|refused|network|connection|pull|download' "$supabase_log" \
              | sed -E '/key|token|secret|password|credential|jwt/Ic\[redacted sensitive diagnostic line]' \
              || true
            rm -f "$supabase_log"
            exit "$status"
          fi
      - run: supabase db reset --local
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Read Playwright version
        id: playwright-version-visual-desktop
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version-visual-desktop.outputs.version }}
      - name: Install Playwright browsers and deps
        timeout-minutes: 26
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::playwright install (tentative $attempt/3)"
            # `sudo apt-get` peut survivre au PID de tête après un stall miroir.
            # Une session dédiée donne au watchdog un PGID unique à tuer en entier.
            setsid pnpm exec playwright install --with-deps chromium webkit &
            pgid=$!
            (
              sleep 8m
              if sudo kill -0 -- "-$pgid" 2>/dev/null; then
                echo "::warning::Tentative $attempt dépasse 8 min ; arrêt TERM du groupe $pgid."
                if ! sudo kill -TERM -- "-$pgid"; then
                  echo "::error::Impossible d'envoyer TERM au groupe $pgid."
                fi
                sleep 5
                if sudo kill -0 -- "-$pgid" 2>/dev/null; then
                  echo "::warning::Le groupe $pgid survit à TERM ; arrêt KILL."
                  if ! sudo kill -KILL -- "-$pgid"; then
                    echo "::error::Impossible d'envoyer KILL au groupe $pgid."
                  fi
                fi
              fi
            ) &
            watchdog=$!
            if wait "$pgid"; then
              kill "$watchdog" 2>/dev/null || true
              wait "$watchdog" 2>/dev/null || true
              echo "::endgroup::"
              exit 0
            fi
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            echo "::endgroup::"
            echo "::warning::Tentative $attempt echouee ou expiree apres 8 min (stall miroir apt probable)."
            sleep 15
          done
          echo "::error::playwright install a echoue 3 fois de suite - stall persistant, pas un alea."
          exit 1
      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.mjs', 'middleware.ts', 'app/**', 'components/**', 'i18n/**', 'lib/**', 'messages/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - name: Bake test env into production build
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_DISABLE_UIR=1"
          } > .env.production
      - name: Build production
        run: pnpm build
        env:
          # VERCEL_ENV=preview : ce build tourne avec des secrets synthétiques (RESEND_API_KEY
          # factice, pas de CRON_SECRET/UPSTASH réels) — sans ce flag, isProductionEnvironment()
          # (lib/security/environment-validation.ts, 142dfa8) le traite comme un build de
          # production réel et échoue sur "Unsafe production environment configuration".
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
          NEXT_PUBLIC_DISABLE_UIR: '1'
      - name: Free disk before visual tests
        run: rm -rf .next/cache
      - run: pnpm test:visual:desktop
        env:
          E2E_PROD_BUILD: '1'
          # webServer hérite de cet env pour spawn `next start` ; sans VERCEL_ENV=preview
          # le runtime retombe sous le garde-fou 142dfa8 (rejette aussi ENABLE_PRIMITIVES_DEMO).
          VERCEL_ENV: preview
          ENABLE_PRIMITIVES_DEMO: '1'
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      - name: Remove test environment files
        if: always()
        run: rm -f .env.production .env.test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-blob-report-desktop
          path: blob-report/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-traces-desktop
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

