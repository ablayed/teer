  # Contextes AGREGES requis par la protection de branche `main` :
  #   test-e2e (chromium) / test-e2e (pixel-7) / test-e2e (iphone-14)
  #
  # `needs:` ne sait pas cibler une combinaison de matrice : on ne peut pas
  # dire « seulement les shards chromium ». L'agregat attend donc TOUS les jobs
  # E2E, puis verifie la presence du jeton de succes de CHAQUE shard de SON
  # navigateur (1 job cible + 4 shards de regression). Un shard rouge ne publie
  # pas son jeton, le compte tombe, l'agregat echoue.
  #
  # Ce n'est PAS un check vert de complaisance : il ne peut pas passer sans les
  # 5 jetons, et il echoue aussi si un job a ete annule ou saute (aucun jeton).
  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-e2e-phase1, test-e2e-regression]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, pixel-7, iphone-14]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-ok-${{ matrix.project }}-*
          path: markers
          merge-multiple: true
      - name: Verify every ${{ matrix.project }} shard succeeded
        run: |
          set -euo pipefail
          expected="phase1-${{ matrix.project }}.ok"
          for shard in 1 2 3 4; do
            expected="$expected regression-${{ matrix.project }}-$shard.ok"
          done
          missing=""
          for marker in $expected; do
            if [ ! -f "markers/$marker" ]; then
              missing="$missing $marker"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Shards ${{ matrix.project }} en echec, annules ou sautes (jetons manquants) :$missing"
            exit 1
          fi
          echo "Tous les shards ${{ matrix.project }} ont reussi."

  merge-e2e-reports:
    runs-on: ubuntu-latest
    needs: [test-e2e-phase1, test-e2e-regression]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports when E2E produced artifacts
        run: |
          shopt -s nullglob
          reports=(all-blob-reports/*.zip)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No Playwright blob reports were produced; E2E jobs were skipped."
            exit 0
          fi
          pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
