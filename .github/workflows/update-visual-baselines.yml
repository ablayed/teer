name: update-visual-baselines

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Baselines à régénérer (primitives = page démo uniquement, sections = 6 écrans, all = tout)'
        required: false
        default: 'primitives'
        type: choice
        options:
          - primitives
          - sections
          - all
      test_filter:
        description: "Filtre Playwright --grep (ex. clients). Vide = comportement scope habituel. Si renseigné, mettre scope=sections par convention (test_filter prend priorité)."
        required: false
        default: ""
      projects:
        description: "Projets Playwright à cibler, séparés par espace (ex. 'pixel-7 iphone-14' pour mobile uniquement). Vide = tous les projets (chromium + pixel-7 + iphone-14)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Africa/Dakar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x edge-runtime
      - run: supabase db reset --local
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Bake test env into production build
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_DISABLE_UIR=1"
          } > .env.production
      - name: Build production
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
          NEXT_PUBLIC_DISABLE_UIR: '1'
      - name: Free disk before visual tests
        run: rm -rf .next/cache
      - name: Generate Linux baselines
        id: generate
        continue-on-error: true
        run: |
          FILTER='${{ github.event.inputs.test_filter }}'
          PROJECTS='${{ github.event.inputs.projects }}'
          PROJECT_FLAGS=""
          for p in $PROJECTS; do
            PROJECT_FLAGS="$PROJECT_FLAGS --project=$p"
          done
          if [ -n "$FILTER" ]; then
            # Ciblage d'un ou plusieurs tests par nom (ex. clients).
            # Opère uniquement sur la spec sections ; les baselines des autres écrans sont préservées.
            pnpm exec playwright test tests/visual/sections.visual.spec.ts --grep "$FILTER" --update-snapshots --retries=0 $PROJECT_FLAGS
          elif [ "${{ github.event.inputs.scope }}" = "primitives" ]; then
            pnpm exec playwright test tests/visual/primitives.visual.spec.ts --update-snapshots --retries=0 $PROJECT_FLAGS
          elif [ "${{ github.event.inputs.scope }}" = "sections" ]; then
            pnpm exec playwright test tests/visual/sections.visual.spec.ts --update-snapshots --retries=0 $PROJECT_FLAGS
          else
            pnpm exec playwright test tests/visual --update-snapshots --retries=0 $PROJECT_FLAGS
          fi
        env:
          TZ: Africa/Dakar
          E2E_PROD_BUILD: '1'
          ENABLE_PRIMITIVES_DEMO: '1'
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      - name: Remove test environment files
        if: always()
        run: rm -f .env.production .env.test
      - name: Commit generated baselines
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'tests/__screenshots__/**/*-linux.png'
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore(test): baselines visuelles Linux (bootstrap auto)"
          git push origin HEAD:${GITHUB_REF_NAME}
