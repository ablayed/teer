name: update-visual-baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Africa/Dakar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.102.0 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x edge-runtime
      - run: supabase db reset --local
      - run: echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
      - run: |
          while IFS= read -r line; do
            case "$line" in
              *=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#\"}"
                value="${value%\"}"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(
            supabase status -o env \
              --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Bake test env into production build
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
            echo "RESEND_API_KEY=test-resend-api-key"
            echo "NEXT_PUBLIC_DISABLE_UIR=1"
          } > .env.production
          cp .env.production .env.test
      - name: Build production
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
          NEXT_PUBLIC_DISABLE_UIR: '1'
      - name: Free disk before visual tests
        run: rm -rf .next/cache
      - name: Update Linux visual baselines
        run: pnpm exec playwright test tests/visual --update-snapshots
        env:
          E2E_PROD_BUILD: '1'
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: test-resend-api-key
      - name: Commit generated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --short -- tests/__screenshots__)" ]; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git add tests/__screenshots__
          git commit -m "chore(test): update linux visual baselines"
          git push origin HEAD:${GITHUB_REF_NAME}
